<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUSA DPD</title>
    <!-- Tailwind and SweetAlert are loaded locally via the build (no CDNs) -->
    <script>
      // Apply user preferences early to avoid FOUC.
      // Default to light mode unless localStorage explicitly sets dark === '1'.
      (function(){
        try{
          var l = localStorage.getItem('locale') || 'id';
          document.documentElement.lang = l;
          var dark = localStorage.getItem('dark');
          if(dark === '1') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        }catch(e){/* ignore */}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
